name: Publish compute client

# Publishes compute-python to PyPI. Tag from this repository:
#   git tag compute-client-v0.1.0 && git push origin compute-client-v0.1.0
on:
  push:
    tags:
      - 'compute-client-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: compute-python
        run: |
          declared="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/central_storage_compute/__init__.py').read_text()).group(1))")"
          tagged="${GITHUB_REF_NAME#compute-client-v}"
          test "$declared" = "$tagged" || { echo "tag $tagged != __version__ $declared"; exit 1; }

      - name: Run the client test suite
        working-directory: compute-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest tests -q

      - name: Build sdist and wheel
        working-directory: compute-python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: compute-client-dist
          path: compute-python/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing: PyPI verifies this OIDC token, so no API token is stored here.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compute-client-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
